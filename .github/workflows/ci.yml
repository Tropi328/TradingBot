name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (core scope)
        run: |
          ruff check bot/data/api_models.py bot/data/capital_client.py bot/storage/db.py bot/storage/journal.py bot/cli bot/runners main.py tests/test_capital_client_resilience.py tests/test_db_identifier_validation.py --ignore E501

      - name: Mypy (core scope)
        run: |
          mypy bot/data/api_models.py bot/data/capital_client.py bot/storage/db.py bot/storage/journal.py bot/cli bot/runners main.py --follow-imports=skip --disable-error-code import-untyped

      - name: Tests with temporary coverage gate
        run: pytest tests/ --cov=bot --cov=main --cov-report=term-missing --cov-fail-under=55
