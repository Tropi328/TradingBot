name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (full project)
        run: |
          ruff check bot/ main.py tests/ --ignore E501

      - name: Mypy (full project)
        run: |
          mypy bot/ main.py --follow-imports=skip --disable-error-code import-untyped

      - name: Dependency audit (known vulnerabilities)
        run: |
          python -m pip install pip-audit
          pip-audit --strict --desc on 2>&1 || echo "::warning::pip-audit found vulnerabilities"

      - name: Bandit (security linting)
        run: |
          python -m pip install bandit
          bandit -r bot/ -c pyproject.toml --severity-level medium 2>&1 || echo "::warning::bandit found security issues"

      - name: Tests with temporary coverage gate
        run: pytest tests/ --cov=bot --cov=main --cov-report=term-missing --cov-fail-under=60
