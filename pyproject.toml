[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Trading bot for Capital.com paper/live workflows"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "tenacity>=9.0,<10",
  "tzdata>=2024.1",
  "pandas>=2.2,<3",
  "pyarrow>=16.0,<18",
  "matplotlib>=3.8,<4",
  "Pillow>=10.0,<12",
  "rich>=13.0,<14",
  "plotext>=5.2,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "types-requests>=2.32.0",
  "types-PyYAML>=6.0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
  "E402",    # module-import-not-at-top — late imports are intentional (circular import avoidance)
  "E501",    # line too long — handled by formatter
  "B008",    # function call in default argument — common with Pydantic Field()
  "UP007",   # use X | Y for union — keep Optional[] for readability in older code
  "UP038",   # non-pep604-isinstance — isinstance(x, (A, B)) is fine
  "SIM108",  # use ternary operator — sometimes less readable
  "RUF001",  # ambiguous unicode char in string — Polish text is intentional
  "RUF002",  # ambiguous unicode char in docstring — Polish text is intentional
  "RUF003",  # ambiguous unicode char in comment — Polish text is intentional
  "RUF012",  # mutable class variable without ClassVar — too noisy with dataclasses
]

[tool.ruff.lint.per-file-ignores]
# B023 (loop-variable capture) needs careful manual review — tracked as follow-up
"bot/backtest/engine.py" = ["B023"]
"bot/app_main.py" = ["B023"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]
