[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Trading bot for Capital.com paper/live workflows"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "tenacity>=9.0,<10",
  "tzdata>=2024.1",
  "pandas>=2.2,<3",
  "pyarrow>=16.0,<18",
  "matplotlib>=3.8,<4",
  "Pillow>=10.0,<12",
  "rich>=13.0,<14",
  "plotext>=5.2,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "types-requests>=2.32.0",
  "types-PyYAML>=6.0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
