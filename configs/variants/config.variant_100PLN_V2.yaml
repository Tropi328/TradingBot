# ============================================================
# 100PLN_V2 — Aggressive small-account variant (100 PLN ≈ $25)
# ============================================================
# Designed for Capital.com (EU/ESMA 20:1 leverage, ~8.87 PLN min margin).
# Key changes vs 100PLN_BASE:
#   - equity 25 USD (≈100 PLN), wider thresholds (58/52), more trades/day
#   - relative low_equity_threshold (pct), auto min_risk_cash
#   - TP gradient by score, compound equity, session filter
#   - relaxed edge-to-cost & spread penalty for small-lot reality
# ============================================================

timezone: Europe/Warsaw
instrument:
  epic: XAUUSD
  currency: USD
  point_size: 0.01
  minimal_tick_buffer: 0.05
  min_size: 0.01
  size_step: 0.01
assets:
- epic: GOLD
  currency: USD
  point_size: 0.01
  minimal_tick_buffer: 0.05
  min_size: 0.01
  size_step: 0.01
  trade_enabled: true
- epic: XAUUSD
  currency: USD
  point_size: 0.01
  minimal_tick_buffer: 0.05
  min_size: 0.01
  size_step: 0.01
  trade_enabled: true
timeframes:
  h1: H1
  m15: M15
  m5: M5
indicators:
  ema_period_h1: 200
  atr_period: 14
swings:
  fractal_left: 2
  fractal_right: 2
sweep:
  lookback_min_hours: 2
  lookback_max_hours: 8
  threshold_atr_multiplier: 0.15
displacement:
  base_multiplier: 1.3
  a_plus_multiplier: 1.6
execution:
  limit_ttl_bars: 6
  loop_seconds: 45
  heartbeat_seconds: 300
  max_data_stale_seconds: 900
  quote_refresh_seconds_trade: 30
  quote_refresh_seconds_observe: 60
  candle_close_grace_seconds: 3
  candle_retry_seconds: 15
  sync_pending_seconds: 30
  sync_positions_seconds: 30
  history_bars:
    h1: 600
    m15: 500
    m5: 500
spread_filter:
  window: 100
  max_multiple_of_median: 2.5          # slightly relaxed vs 2.0 for small lots
news_gate:
  block_minutes: 60

# ── Risk ────────────────────────────────────────────────────
risk:
  equity: 25                            # $25 ≈ 100 PLN
  risk_per_trade: 0.02                  # 2% → $0.50 risk per trade
  risk_mode: percent
  min_risk_cash_per_trade: 0.10         # overridden by auto below
  max_risk_cash_per_trade: 0.75
  min_risk_cash_auto: true              # auto-compute from equity
  min_risk_cash_auto_pct: 0.004         # 0.4% of equity = $0.10
  allow_min_size_override_if_within_risk: true  # allow 0.01 lot when risk OK
  max_trades_per_day: 12                # more opportunities
  daily_stop_pct: 0.04                  # 4% daily stop ($1.00)
  max_positions: 3
  global_max_positions: 5
  max_total_risk_pct: 0.04
  cooldown_loss_streak: 3               # 3 consecutive losses → cooldown
  cooldown_minutes: 45                  # shorter cooldown
  correlation_groups: []
  # ── Relative low-equity threshold ──
  low_equity_mode_enabled: true
  low_equity_threshold: 250.0           # ignored when threshold_pct > 0
  low_equity_threshold_pct: 0.5         # low-equity triggers at 50% of initial ($12.50)
  low_equity_risk_multiplier: 0.6       # reduce risk to 60% in low-equity mode
  low_equity_risk_per_trade_cap: 0.01
  low_equity_max_trades_per_day: 4
  low_equity_daily_stop_pct: 0.02
  low_equity_min_size_fallback_enabled: true
  low_equity_min_size_fallback_max_risk_pct: 0.02

# ── Capital API ─────────────────────────────────────────────
capital:
  demo_base_url: https://demo-api-capital.backend-capital.com/api/v1
  rate_limit_rps: 2.0
  rate_limit_burst: 5
  request_max_attempts: 6
  backoff_base_seconds: 0.5
  backoff_max_seconds: 20.0
  reconnect_short_retries: 2
  session_refresh_min_interval_seconds: 5
calendar:
  provider: dummy
  dummy_file: news_data/events.json
  http_timeout_seconds: 10
  http_cache_ttl_seconds: 300
watchlist:
  epics: []
  log_quotes: true
monitoring:
  dashboard_path: runtime_dashboard.json
  dashboard_interval_seconds: 30
  alerts_enabled: true
  log_decision_reasons: true
strategy_runtime:
  allow_neutral_bias: false
  neutral_bias_risk_multiplier: 0.5

# ── Decision policy — AGGRESSIVE ────────────────────────────
decision_policy:
  trade_score_threshold: 38             # aligned with thresholds_v2
  small_score_min: 31                   # aligned with thresholds_v2
  small_score_max: 37
  trade_risk_multiplier: 1.0
  small_risk_multiplier_default: 0.5

# ── Backtest tuning ─────────────────────────────────────────
backtest_tuning:
  wait_reaction_timeout_bars: 6
  wait_mitigation_timeout_bars: 10
  wait_hard_block_bars: 0
  reaction_timeout_force_enable: true
  wait_timeout_soft_penalty: 2.0
  wait_timeout_small_risk_multiplier: 0.4
  wait_timeout_soft_grace_bars: 3
  max_loss_r_cap: 1.0
  # ── TP / BE — let winners run ──
  tp1_trigger_r: 1.5                    # later partial (was 1.2)
  tp1_fraction: 0.25                    # smaller partial (was 0.35)
  be_offset_r: 0.10                     # wider BE (was 0.05)
  be_delay_bars_after_tp1: 5            # more room (was 2)
  tp_target_min_r: 2.0
  tp_target_max_r: 3.0
  tp_target_a_plus_r: 3.5              # higher A+ target
  tp_profile_mode: strict_tp_price
  # ── TP gradient by score ──
  tp_gradient_enabled: true
  tp_gradient_tier_high_score: 55.0     # score ≥55 → 3.0R (top tier)
  tp_gradient_tier_high_r: 3.0
  tp_gradient_tier_mid_score: 42.0      # score ≥42 → 2.5R (mid tier)
  tp_gradient_tier_mid_r: 2.5
  tp_gradient_tier_low_r: 2.0           # score <42 → 2.0R (base tier)
  # ── Trailing stop ──
  trailing_after_tp1: true
  trailing_swing_window_bars: 12
  trailing_buffer_r: 0.06               # tighter trail
  # ── Expected RR ──
  expected_rr_min: 1.5                  # relaxed (was 2.0) to take more trades
  expected_rr_lookback_bars: 120
  segment_soft_gap_minutes: 120
  segment_hard_gap_minutes: 600
  # ── Penalties — RELAXED ──
  penalty_orb_no_retest: -1.5           # was -2.5
  penalty_orb_confirm_low: -1.0         # was -1.5
  penalty_scalp_no_displacement: -2.0   # was -4.0
  penalty_scalp_no_mss: -1.5           # was -3.0
  penalty_scalp_no_fvg: -1.0           # was -2.0
  ohlc_only_spread_soft_penalty: 0.0    # removed (was 3.0) — critical for small accounts
  # ── Thresholds — AGGRESSIVE ──
  thresholds_v2_trade: 37.0             # was 94.0 → matches proven PNL_R83 profile
  thresholds_v2_small_min: 31.0         # was 89.0 → matches proven PNL_R83 profile
  thresholds_v2_small_max: 36.0
  # ── Spread ──
  dynamic_spread_ratio_frac: 0.9
  dynamic_atr_buffer_mult: 1.1
  dynamic_spread_score_penalty: 1.5     # slightly lower
  dynamic_atr_score_penalty: 0.5        # relaxed
  dynamic_assumed_spread_enabled: true
  dynamic_assumed_spread_min_by_symbol:
    XAUUSD: 0.5
    GOLD: 0.5
  dynamic_assumed_spread_max_by_symbol:
    XAUUSD: 0.8
    GOLD: 0.8
  assumed_spread_by_symbol:
    XAUUSD: 0.65
    GOLD: 0.65
  # ── Broker ──
  broker_leverage: 20.0
  broker_margin_requirement_pct: 5.0
  overnight_swap_time_utc: '23:00'
  overnight_swap_long_pct: -0.016
  overnight_swap_short_pct: 0.0076
  spread_limit_points: null             # disabled — assumed OHLC spread handled by soft penalty
  no_overnight: true
  rollover_block_minutes_before: 30
  rollover_block_minutes_after: 30
  force_close_before_rollover_minutes: 15
  min_edge_to_cost_ratio: 2.0           # relaxed (was 4.0) — critical for small accounts
  fx_conversion_pct: 0.7

# ── Session filter — ENABLED ────────────────────────────────
session_filter:
  enabled: true
  sessions:
  - name: LONDON
    utc_start: "07:00"
    utc_end: "11:00"
    threshold_adjust: -3.0
    risk_mult: 1.0
  - name: NY_OVERLAP
    utc_start: "12:00"
    utc_end: "16:00"
    threshold_adjust: -2.0
    risk_mult: 1.0
  - name: NY_AFTERNOON
    utc_start: "16:00"
    utc_end: "20:00"
    threshold_adjust: 0.0
    risk_mult: 0.8
  - name: ASIA
    utc_start: "00:00"
    utc_end: "07:00"
    threshold_adjust: 4.0
    risk_mult: 0.5
  block_outside_sessions: false

# ── Compound equity — ENABLED ───────────────────────────────
compound_equity:
  enabled: true
  floor_equity: 10.0                    # floor at $10 (≈40 PLN)
  cap_equity: 0.0                       # no cap — let it compound
  smooth_window: 0                      # raw equity

# ── Orderflow (lite only for gold) ──────────────────────────
orderflow:
  default_mode: LITE
  full_symbols: []
  default_window: 64
  trigger_bonus_max: 10.0
  execution_bonus_max: 5.0
  divergence_penalty_min: 6.0
  divergence_penalty_max: 10.0
  small_soft_gate_confidence: 0.70
  small_soft_gate_chop: 0.70

# ── Strategy router — GOLD/XAUUSD only ─────────────────────
strategy_router:
  symbols:
  - symbol: GOLD
    strategy: TREND_PULLBACK_M15
    params:
      trend_strength_min: 0.14          # slightly relaxed
      trigger_displacement_atr: 0.85
      min_confirm: 1
      min_confirm_trade: 1              # lowered from 2
      min_confirm_small: 1
      a_plus_trend_strength_min: 0.38
      a_plus_displacement_atr: 1.3
      a_plus_spread_ratio_max: 0.15
      quality_gates:
        spread_ratio_max: 0.18          # relaxed from 0.15
        min_confirm: 1
        min_confirm_trade: 1
        min_confirm_small: 1
        min_atr_m5: 0.12
      soft_penalties:
        TREND_CONFIRMATIONS_LOW: -1.5   # softer penalty
    risk:
      trade_risk_multiplier: 1.0
      small_risk_multiplier: 0.5
      max_trades_per_day: 10
    priority: 78
    cooldown_seconds: 600               # shorter cooldown
  - symbol: GOLD
    strategy: ORB_H4_RETEST
    params:
      max_retest_minutes: 120
      retest_tolerance_atr: 0.22
      min_displacement_atr: 0.75
      min_confirm: 1
      min_confirm_trade: 1
      min_confirm_small: 1
      a_plus_displacement_atr: 1.2
      a_plus_breakout_quality_min: 16.0
      a_plus_spread_ratio_max: 0.15
      quality_gates:
        spread_ratio_max: 0.18
        min_confirm: 1
        min_confirm_trade: 1
        min_confirm_small: 1
        min_atr_m5: 0.12
      soft_penalties:
        ORB_NO_RETEST: -1.5
        ORB_CONFIRMATIONS_LOW: -1.0
    risk:
      trade_risk_multiplier: 1.0
      small_risk_multiplier: 0.5
      max_trades_per_day: 6
    priority: 72
    cooldown_seconds: 900
  - symbol: XAUUSD
    strategy: TREND_PULLBACK_M15
    params:
      trend_strength_min: 0.14
      trigger_displacement_atr: 0.85
      min_confirm: 1
      min_confirm_trade: 1
      min_confirm_small: 1
      a_plus_trend_strength_min: 0.38
      a_plus_displacement_atr: 1.3
      a_plus_spread_ratio_max: 0.15
      quality_gates:
        spread_ratio_max: 0.18
        min_confirm: 1
        min_confirm_trade: 1
        min_confirm_small: 1
        min_atr_m5: 0.12
      soft_penalties:
        TREND_CONFIRMATIONS_LOW: -1.5
    risk:
      trade_risk_multiplier: 1.0
      small_risk_multiplier: 0.5
      max_trades_per_day: 10
    priority: 78
    cooldown_seconds: 600
  - symbol: XAUUSD
    strategy: ORB_H4_RETEST
    params:
      max_retest_minutes: 120
      retest_tolerance_atr: 0.22
      min_displacement_atr: 0.75
      min_confirm: 1
      min_confirm_trade: 1
      min_confirm_small: 1
      a_plus_displacement_atr: 1.2
      a_plus_breakout_quality_min: 16.0
      a_plus_spread_ratio_max: 0.15
      quality_gates:
        spread_ratio_max: 0.18
        min_confirm: 1
        min_confirm_trade: 1
        min_confirm_small: 1
        min_atr_m5: 0.12
      soft_penalties:
        ORB_NO_RETEST: -1.5
        ORB_CONFIRMATIONS_LOW: -1.0
    risk:
      trade_risk_multiplier: 1.0
      small_risk_multiplier: 0.5
      max_trades_per_day: 6
    priority: 72
    cooldown_seconds: 900
scalp:
  bias_timeframe: M15
  trigger_timeframe: M5
  candidate_ttl_minutes: 60
  trade_score_threshold: 38             # aligned with thresholds_v2
  small_score_min: 31
  small_score_max: 37
  small_risk_multiplier: 0.5
  miss_window_minutes: 60
  miss_move_atr: 1.0
  be_after_r: 1.0
  time_stop_minutes: 120
monte_carlo:
  adaptive:
    enabled: true
    min_trades: 5
    resim_interval: 2
    num_simulations: 500
    chart_interval: 3
  live_window:
    enabled: true
    refresh_seconds: 1.0
    window_title: 'IGNACY BOT — Monte Carlo Live'
    show_stats_overlay: true
    max_fps: 2
    open_on_start: true
    viewer_mode: 'process'
    png_path: 'reports/live/monte_carlo.png'
    json_path: 'reports/live/monte_carlo.json'
portfolio:
  max_open_positions_total: 4
  max_per_symbol: 2
  daily_risk_r: 3.0                     # up from 2.0
  default_cooldown_seconds: 300
  max_entries_per_cycle: 3              # up from 2
