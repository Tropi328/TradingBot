services:
  trading-bot-paper:
    build: .
    command: ["--paper", "--config", "configs/variants/config.variant_SAFE_BASE.yaml"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./state:/app/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import bot; print('ok')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
